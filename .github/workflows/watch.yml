# Zewnetrzny stroz: co 15 minut sprawdza z GitHuba, czy strona i wezel Oracle (odbior SMS, VPN, stroz domu) odpowiadaja.
# Nie zalezy ani od domu, ani od Oracle. Wiadomosc w Telegramie tylko przy zmianie stanu (awaria / powrot).
name: watch
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: wyslij wiadomosc testowa
        type: boolean
        default: false
permissions:
  contents: read
concurrency: watch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: check
        id: check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          code() { curl -s -o /dev/null -m 20 --retry 2 --retry-delay 10 --retry-all-errors -w '%{http_code}' "$@"; }
          say() { curl -s -m 20 -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$1"; }
          [ "${{ inputs.test }}" != true ] || say "🛰 Внешний сторож (GitHub) установлен: проверяю сайт и узел Oracle каждые 15 минут, напишу при сбое."
          fail=""
          [ "$(code https://gitcloud.pl/)" = 200 ] || fail="$fail сайт gitcloud.pl не открывается;"
          [ "$(code -X POST https://hook.gitcloud.pl/hook/sms)" = 404 ] || fail="$fail узел Oracle не отвечает (приём SMS, VPN, сторож дома);"
          prev=$(cat state 2>/dev/null || echo ok)
          now=ok; [ -z "$fail" ] || now="down:$fail"
          echo "prev=$prev"; echo "now=$now"
          if [ "$now" != "$prev" ]; then
            if [ "$now" = ok ]; then say "🛰 Внешний сторож (GitHub): всё снова отвечает."; else say "🛰 Внешний сторож (GitHub):$fail"; fi
            echo "$now" > state
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.check.outputs.changed == '1'
        with:
          path: state
          key: watch-state-${{ github.run_id }}
