# Lighthouse CI: wydajność, dostępność, dobre praktyki i SEO zbudowanej strony.
# Osobny workflow, więc nie blokuje wdrożenia (deploy.yml). Progi w lighthouserc.json: wydajność tylko ostrzega
# poniżej 0,75; dostępność, dobre praktyki i SEO poniżej 0,9 dają czerwony wynik (06.11.2026 lokalnie: 0,76-0,99 / 0,96 / 1 / 1).
# Raport: link w logu kroku "lhci autorun". Tylko strony z treścią: przekierowanie (np. /isp/) nie daje wyniku wydajności (NaN, 11.11.2026).
name: lighthouse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: true
jobs:
  lhci:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Filmy z wydania „media” (decyzja #752; w git ich nie ma, adresy na stronie bez zmian)
        run: gh release download media -R "$GITHUB_REPOSITORY" -p '*.mp4' -D public/img/projekty --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - name: lhci autorun
        run: npx --yes @lhci/cli@0.14.x autorun
