# Budowanie strony (Astro) i wdrożenie na GitHub Pages.
# Codziennie o 05:10 UTC przebudowa: projekty z polem "od" pojawiają się same od swojej daty.
# Akcje na Node 24 (07.11.2026). GitHub Pages potrafi zawisnąć w syncing_files / updating_pages: pierwsza próba
# ma limit 6 min, po niepowodzeniu 3 min przerwy (Pages kończy anulowanie) i druga próba z limitem 10 min.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Filmy z wydania „media” (decyzja #752; w git ich nie ma, adresy na stronie bez zmian)
        run: gh release download media -R "$GITHUB_REPOSITORY" -p '*.mp4' -D public/img/projekty --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # .nojekyll
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.again.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 360000
      - name: przerwa przed drugą próbą
        if: steps.first.outcome == 'failure'
        run: |
          echo "::warning::Pierwsza próba wdrożenia nie powiodła się, druga za 3 min"
          sleep 180
      - id: again
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
  indexnow:
    # Decyzja #750: po wdrożeniu z pushu (nocne prowadzenie strony) Bing i Yandex dostają listę stron przez IndexNow.
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - run: |
          body='{"host":"gitcloud.pl","key":"ac56c9c7db3ad44de971eb310b37469b","keyLocation":"https://gitcloud.pl/ac56c9c7db3ad44de971eb310b37469b.txt","urlList":["https://gitcloud.pl/","https://gitcloud.pl/zmiany/","https://gitcloud.pl/en/","https://gitcloud.pl/en/zmiany/","https://gitcloud.pl/ru/","https://gitcloud.pl/ru/zmiany/"]}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: $code"; [ "$code" = 200 ] || [ "$code" = 202 ]
