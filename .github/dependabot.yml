# Raz w tygodniu (poniedziałek) PR z nowymi wersjami akcji GitHuba i pakietów npm, każda grupa w jednym PR.
# Nic nie wchodzi samo: PR scala się ręcznie po zielonym buildzie (npm run build lokalnie, deploy/lighthouse po scaleniu).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    groups:
      akcje:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    groups:
      npm-drobne:
        update-types: [minor, patch]
    commit-message:
      prefix: "npm"
